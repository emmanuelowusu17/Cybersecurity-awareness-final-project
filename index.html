<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Stay Safe Online | Cybersecurity Awareness Hub</title>
        <!-- utf-8 lets emoji and special symbols display correctly -->
        <meta charset="utf-8">
        <!-- Makes the page fit the width of phone screens instead of zooming out -->
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <!-- Using bootstrap 5 framework-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

        <!-- Custom CSS for the cybersecurity site -->
        <link rel="stylesheet" href="cyber.css">

        <!-- Bootstrap's JavaScript runs the interactive parts, like the mobile menu button -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <!-- jQuery is used at the bottom of the page to load the shared navbar -->
        <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    </head>
    <!-- d-flex, flex-column, and min-vh-100 make the body at least as tall as the screen,
         so the footer stays at the bottom even when a page is short -->
    <body class="d-flex flex-column min-vh-100">
        <!-- Empty box that the navbar from nav.html gets loaded into (see the script at the bottom) -->
        <div id="nav-placeholder"></div>
</body>
</html>
